version: '3.8'

services:
  arfflow-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arfflow-orchestrator
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_PRIVATE_KEY=[1,2,3...your_keypair_bytes]
      - RESEND_API_KEY=re_your_verified_resend_api_key
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - ENTERPRISE_AUDIT_EMAIL=settlements@arf.one
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"