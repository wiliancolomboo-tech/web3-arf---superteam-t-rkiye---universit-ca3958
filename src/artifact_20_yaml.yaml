version: '3.8'

services:
  arf-relayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arf-settlement-relayer
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=ARFXsUpErTeAm111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - TREASURY_OPS_EMAIL=${TREASURY_OPS_EMAIL}
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"