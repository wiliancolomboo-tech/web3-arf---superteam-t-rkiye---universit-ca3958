version: '3.8'

services:
  arf-nexus-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arf-nexus-daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=ArfNexus11111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - TREASURY_EMAIL_DEST=settlement@arf.one
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'console.log(process.uptime())'"]
      interval: 30s
      timeout: 10s
      retries: 3