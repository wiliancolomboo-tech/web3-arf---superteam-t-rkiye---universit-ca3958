version: '3.8'

services:
  arfflow-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arfflow-orchestrator
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - ARF_PROGRAM_ID=Arf1111111111111111111111111111111111111111
      - ORCHESTRATOR_PRIVATE_KEY=${ORCHESTRATOR_PRIVATE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - COMPLIANCE_EMAIL=compliance@arf.one
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3