[package]
name = "arf-settlement-protocol"
version = "0.1.0"
description = "ArfFlow - Enterprise Liquidity & Settlement Protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arf_settlement_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["token"] }