version: '3.8'

services:
  arfpulse-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arfpulse-sentinel-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=ArfPu1se11111111111111111111111111111111111
      - RESEND_API_KEY=re_your_api_key_here
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - OPS_EMAIL=treasury@arf.one
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3