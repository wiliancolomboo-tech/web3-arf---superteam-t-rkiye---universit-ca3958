version: '3.8'

services:
  arfflow-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arfflow-institutional-daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=Arf1111111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY:-re_dummy_test_key}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3